name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify schemas and documentation
        run: |
          python scripts/docs.py reference --check
          python scripts/docs.py check
      - name: Verify runtime manifest
        run: python tools/build_studio_manifest.py --check
      - name: Verify Kinetic and capture contracts
        run: node --test tests/test_kinetic_core.mjs tests/test_capture_gpu.mjs tests/test_capture_lifecycle.mjs
